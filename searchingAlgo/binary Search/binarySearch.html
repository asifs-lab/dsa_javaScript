<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Serach</title>
  </head>
  <body>
    <script>
      let arr = [10, 20, 30, 40, 50, 60, 70, 80];
      let target = 12;
      let low = 0;
      let high = arr.length - 1;
      let found = -1;

      while (low <= high) {
        let sum = low + high;
        let mid = Math.floor(sum / 2);
        if (arr[mid] === target) {
          found = mid;
          break;
        } else if (arr[mid] < target) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      if (found !== -1) {
        console.log("Got it at " + found);
      } else {
        console.log("sorry i love you");
      }
    </script>
  </body>
</html>
