<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete</title>
  </head>
  <body>
    <script>
      let arr = [10, 20, 30, 40, 50];
      let position = 2;

      for (let i = position; i < arr.length; i++) {
        arr[i] = arr[i + 1];
      }

      arr.length = arr.length - 1;
      document.write(arr);
      document.write("<br>");
      document.write("length " + arr.length);

      console.log(arr);
    </script>
  </body>
</html>
