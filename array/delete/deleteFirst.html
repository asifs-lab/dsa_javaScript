<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete First</title>
  </head>
  <body>
    <script>
      let arr = [10, 20, 30, 40];
      document.write(arr);
      for (let i = 0; i < arr.length; i++) {
        arr[i] = arr[i + 1];
      }
      arr.length = arr.length - 1;
      document.write("<br>");
      document.write(arr);
    </script>
  </body>
</html>
