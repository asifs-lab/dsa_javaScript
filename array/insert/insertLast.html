<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insert last</title>
  </head>
  <body>
    <script>
      let number = [1, 2, 3, 4, 5, 6, 7, 8];
      let newNum = 10;
      console.log(number);

      let position = number.length;
      number[position] = newNum;

      console.log(number);
    </script>
  </body>
</html>
